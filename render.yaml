services:
  - type: web
    name: offermapping-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TOKEN_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: OFFERMAPPING_DB
        value: /app/data/offermapping.db
